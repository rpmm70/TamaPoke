name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [waveshare-round, cyd-rect]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The pioarduino platform, its toolchains and the libraries are large:
      # cache them between runs. platformio.ini pins the platform release and
      # the library versions, so it is the cache key.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # The ESP32 core version is the one pinned in platformio.ini (pioarduino
      # release), the same one used for local builds. Bump it by hand and on
      # purpose: some new core versions have broken third-party libraries before.
      - name: Compile
        run: pio run -e ${{ matrix.env }}

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h and species.h carry "GENERATED - do not edit" in their header; this
      # catches anyone who edits the output instead of the generator, or forgets
      # to regenerate after touching the source data.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / battle.cpp / i18n.cpp / dex.h compile and run on the PC against
      # Arduino shims, with fake millis() and random() and an in-memory NVS. This
      # is where things have broken: the three bugs of v1.3, v1.4 and v1.8 were
      # pure logic and these tests catch them without touching the board.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py
