; TamaPoke - PlatformIO project (VS Code). See VSCODE_SETUP.md.
;
;   pio run -e cyd-rect                 builds for ELEGOO / ESP32-2432S028R (2.8", 320x240)
;   pio run -e cyd-rect -t upload       builds and flashes
;   pio run -e cyd-rect-touchdebug      same, prints the raw touch readings over serial
;   pio run -e waveshare-round          original board (ESP32-S3 AMOLED 1.75") - currently disabled, see below
;
; NOT TESTED: it could not be built while preparing it. If the first build fails,
; paste the errors as-is; it is most likely a small fix.
;
; The firmware uses ESP_I2S.h => needs ESP32 Arduino core 3.x. The official
; PlatformIO platform is still on core 2.x, which is why pioarduino is used.

[platformio]
default_envs = cyd-rect
; The code lives in the root (Arduino layout), not in src/
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; builds only the firmware: excludes tests, sprite tools and the web
build_src_filter =
  +<*.ino>
  +<*.cpp>
  -<test/>
  -<tools/>
  -<web/>
lib_deps =
  moononournation/GFX Library for Arduino
  olikraus/U8g2

[env:cyd-rect]
board = esp32dev
; No PSRAM and 4 MB of flash: "huge_app" partition (3 MB app, no OTA).
; Even so the binary might not fit with the CJK fonts; see CYD_PORT_NOTES.md.
board_build.partitions = huge_app.csv
upload_speed = 460800
build_flags =
  -D BOARD_CYD_RECT
; Compiles only the GFX sources the CYD uses (ILI9341 over ESP32 SPI) instead of
; all ~90 drivers/buses. BandCanvas derives from Arduino_GFX, so canvas/ is not
; needed. If the link reports "undefined reference to Arduino_Xxx", add its .cpp.
extra_scripts = pre:tools/pio_gfx_filter.py
custom_gfx_sources =
  Arduino_DataBus.cpp
  Arduino_G.cpp
  Arduino_GFX.cpp
  Arduino_TFT.cpp
  databus/Arduino_ESP32SPI.cpp
  display/Arduino_ILI9341.cpp

[env:cyd-rect-touchdebug]
extends = env:cyd-rect
build_flags =
  ${env:cyd-rect.build_flags}
  -D TOUCH_DEBUG

