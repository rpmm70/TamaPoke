; TamaPoke - PlatformIO project (VS Code or the pio CLI).
;
;   pio run -e waveshare-round                   Waveshare ESP32-S3-Touch-AMOLED-1.75 (round 466x466)
;   pio run -e cyd-rect                          ESP32-2432S028R / ELEGOO 2.8" (320x240)
;   pio run -e cyd-rect-touchdebug               same as cyd-rect, prints the raw touch readings over serial
;   pio run -e <env> -t upload                   builds and flashes
;   pio device monitor -e <env>                  serial monitor (115200, exception decoder)
;
; Each env selects its board with -D BOARD_WAVESHARE_ROUND or -D BOARD_CYD_RECT
; (see boards/board_select.h; building with neither stops with #error).
;
; The firmware uses ESP_I2S.h => needs ESP32 Arduino core 3.x. The official
; PlatformIO platform is still on core 2.x, which is why pioarduino is used.
; The platform is pinned to one release (Arduino core 3.3.12, ESP-IDF 5.5.5):
; the "stable" URL moves, and newer releases need a newer PlatformIO Core.
; CI builds with this same file, so CI and local builds use the same core.
; Bump it by hand and on purpose.

[platformio]
default_envs = cyd-rect
; The code lives in the root (Arduino layout), not in src/
src_dir = .

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
; builds only the firmware: excludes tests, sprite tools and the web
build_src_filter =
  +<*.ino>
  +<*.cpp>
  -<test/>
  -<tools/>
  -<web/>
; flags shared by every env; each env appends its own through ${env.build_flags}
build_flags =
lib_deps =
  moononournation/GFX Library for Arduino@1.6.9
  olikraus/U8g2@2.36.18
; Compiles only the GFX sources each env lists in custom_gfx_sources instead of
; all ~90 drivers/buses. If the link reports "undefined reference to
; Arduino_Xxx", add its .cpp to that env's list.
extra_scripts = pre:tools/pio_gfx_filter.py

[env:waveshare-round]
board = esp32-s3-devkitc-1
; 8 MB OPI PSRAM (the 466x466 framebuffer lives there) and 16 MB flash with a
; FAT partition: 3 MB app / 9 MB FATFS
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = app3M_fat9M_16MB.csv
; ARDUINO_USB_CDC_ON_BOOT: Serial is the native USB CDC port.
; BOARD_HAS_PSRAM: what the Arduino IDE defines for "PSRAM: OPI PSRAM" (the
; core's String uses it); the board header defines the same value.
build_flags =
  ${env.build_flags}
  -D BOARD_WAVESHARE_ROUND
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
lib_deps =
  ${env.lib_deps}
  lewisxhe/SensorLib@0.5.1
  lewisxhe/XPowersLib@0.3.3
; CO5300 over ESP32 QSPI, drawn into a full-frame Arduino_Canvas in PSRAM
custom_gfx_sources =
  Arduino_DataBus.cpp
  Arduino_G.cpp
  Arduino_GFX.cpp
  Arduino_OLED.cpp
  Arduino_TFT.cpp
  canvas/Arduino_Canvas.cpp
  databus/Arduino_ESP32QSPI.cpp
  display/Arduino_CO5300.cpp

[env:cyd-rect]
board = esp32dev
; No PSRAM and 4 MB of flash: "huge_app" partition (3 MB app, no OTA).
board_build.partitions = huge_app.csv
build_flags =
  ${env.build_flags}
  -D BOARD_CYD_RECT
; ILI9341 over ESP32 SPI. BandCanvas derives from Arduino_GFX, so canvas/ is
; not needed.
custom_gfx_sources =
  Arduino_DataBus.cpp
  Arduino_G.cpp
  Arduino_GFX.cpp
  Arduino_TFT.cpp
  databus/Arduino_ESP32SPI.cpp
  display/Arduino_ILI9341.cpp

[env:cyd-rect-touchdebug]
extends = env:cyd-rect
build_flags =
  ${env:cyd-rect.build_flags}
  -D TOUCH_DEBUG
